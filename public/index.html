<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Where could we live?</title>
    <meta name="description" content="Find places that fit your priorities, compare the trade-offs, and investigate the numbers." />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./js/ui/main.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to main content</a>
    <header class="site">
      <a class="wordmark" href="#/find"><span class="brand-mark" aria-hidden="true">✳</span> Where could we live<span class="brand-question">?</span></a>
      <nav aria-label="Main">
        <a href="#/find" data-screen="find">Find my places</a>
        <a href="#/explore" data-screen="explore">Explore a city</a>
        <a href="#/compare" data-screen="compare">Compare places</a>
        <a href="#/methodology" data-screen="methodology">How it works</a>
      </nav>
    </header>
    <div class="layout">
      <aside class="panel" id="panel" aria-labelledby="panel-title">
        <h2 class="panel-title" id="panel-title">Your scenario</h2>
        <button type="button" class="panel-summary" id="panel-summary" aria-expanded="false" aria-controls="profile">

          <span class="panel-summary-text" id="panel-summary-text"></span>
        </button>
        <form id="profile" class="profile" onsubmit="return false"></form>
      </aside>
      <main id="main" class="results" tabindex="-1">
        <p class="empty">Loading data…</p>
      </main>
    </div>
    <footer class="site">
      <p>Made for curious decisions. Estimates for planning, not tax or immigration advice.</p>
      <p>Data release <span id="release-version">–</span></p>
    </footer>
